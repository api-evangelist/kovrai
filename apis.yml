name: Kovr.ai
description: Kovr.ai is a security and compliance automation company surfaced through the Battery
  Ventures portfolio and profiled in the API Evangelist network. Its verified public engineering
  presence is the GitHub organization github.com/kovr-ai, whose open-source kovr-aws-nist-compliance
  project validates AWS environments against NIST 800-53 Rev 5 and NIST 800-171 Rev 2 and maps
  findings across the CIS AWS Foundations Benchmark, MITRE ATT&CK, OWASP Cloud Security, the AWS
  Well-Architected Framework, the NIST Cybersecurity Framework, the CSA Cloud Controls Matrix, the
  SANS Critical Security Controls, and NIST SP 800-207 Zero Trust Architecture, running roughly 160
  checks across 50+ AWS services. No public API, developer portal, or machine-readable API
  specification has been located for this company; the corporate website is served behind a
  bot-protection interstitial that blocks automated retrieval, so link properties beyond the
  homepage and the GitHub organization remain unverified.
